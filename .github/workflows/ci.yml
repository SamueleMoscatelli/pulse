name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh

  # Dogfooding: the Quality Gate on this repo's own AI assets (CLAUDE.md, .claude/, fixtures),
  # built from source. GITHUB_ACTIONS selects the `github` format: annotations + job summary.
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -q --release -p pulse-cli -- ci

  # Performance budgets (spec 00-overview) on Apple M-series. Non-blocking: shared runners
  # are noisy, so a red bench is a signal to look at, not a merge gate.
  bench:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: brew install hyperfine
      - run: scripts/bench.sh
