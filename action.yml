name: Pulse
description: Static analysis and Quality Gate for AI assets (instructions, agents, prompts, skills, tools, MCP configs, hooks)
author: SamueleMoscatelli
branding:
  icon: activity
  color: purple

inputs:
  version:
    description: Pulse release to download, e.g. `0.1.0` or `v0.1.0`; `latest` for the newest release
    required: false
    default: latest
  root:
    description: Directory to scan (`pulse -C`)
    required: false
    default: .
  args:
    description: Extra arguments for `pulse ci` (and the SARIF scan), e.g. `--new-only --min-severity medium`
    required: false
    default: ""
  sarif:
    description: Also write a SARIF report and upload it to code scanning (needs `security-events write`)
    required: false
    default: "false"
  sarif-file:
    description: Path of the SARIF report
    required: false
    default: pulse.sarif

outputs:
  sarif-file:
    description: Path of the SARIF report (empty unless `sarif` is true)
    value: ${{ steps.sarif.outputs.file }}

runs:
  using: composite
  steps:
    - name: Install pulse
      shell: bash
      env:
        PULSE_VERSION: ${{ inputs.version }}
        PULSE_REPO: SamueleMoscatelli/pulse
      run: |
        set -euo pipefail
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64) target=aarch64-apple-darwin ;;
          macOS-X64) target=x86_64-apple-darwin ;;
          Linux-X64) target=x86_64-unknown-linux-musl ;;
          Linux-ARM64) target=aarch64-unknown-linux-musl ;;
          Windows-X64) target=x86_64-pc-windows-msvc ;;
          *) echo "::error::pulse has no release binary for ${RUNNER_OS}/${RUNNER_ARCH}"; exit 1 ;;
        esac
        ext=tar.xz
        if [ "${RUNNER_OS}" = Windows ]; then ext=zip; fi
        archive="pulse-cli-${target}.${ext}"
        if [ "${PULSE_VERSION}" = latest ]; then
          base="https://github.com/${PULSE_REPO}/releases/latest/download"
        else
          base="https://github.com/${PULSE_REPO}/releases/download/v${PULSE_VERSION#v}"
        fi
        dir="${RUNNER_TEMP}/pulse"
        rm -rf "${dir}" && mkdir -p "${dir}/bin"
        cd "${dir}"
        curl -fsSL --retry 3 -o "${archive}" "${base}/${archive}"
        curl -fsSL --retry 3 -o "${archive}.sha256" "${base}/${archive}.sha256"
        expected="$(cut -d ' ' -f 1 "${archive}.sha256")"
        if command -v sha256sum >/dev/null; then
          actual="$(sha256sum "${archive}" | cut -d ' ' -f 1)"
        else
          actual="$(shasum -a 256 "${archive}" | cut -d ' ' -f 1)"
        fi
        if [ "${expected}" != "${actual}" ]; then
          echo "::error::checksum mismatch for ${archive}"; exit 1
        fi
        if [ "${ext}" = zip ]; then unzip -q "${archive}" -d extract; else mkdir extract && tar -xJf "${archive}" -C extract; fi
        bin="$(find extract -type f \( -name pulse -o -name pulse.exe \) | head -n 1)"
        if [ -z "${bin}" ]; then echo "::error::no pulse binary in ${archive}"; exit 1; fi
        mv "${bin}" bin/
        chmod +x bin/pulse* || true
        echo "${dir}/bin" >> "${GITHUB_PATH}"
        "${dir}/bin/pulse" --version

    - name: SARIF report
      id: sarif
      if: inputs.sarif == 'true'
      shell: bash
      env:
        PULSE_ROOT: ${{ inputs.root }}
        PULSE_ARGS: ${{ inputs.args }}
        PULSE_SARIF: ${{ inputs.sarif-file }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086 # PULSE_ARGS is a list of flags
        pulse -C "${PULSE_ROOT}" scan -f sarif -o "${PULSE_SARIF}" ${PULSE_ARGS}
        echo "file=${PULSE_SARIF}" >> "${GITHUB_OUTPUT}"

    - name: Upload SARIF
      if: inputs.sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.sarif.outputs.file }}
        category: pulse

    - name: Quality Gate
      shell: bash
      env:
        PULSE_ROOT: ${{ inputs.root }}
        PULSE_ARGS: ${{ inputs.args }}
      run: |
        # shellcheck disable=SC2086 # PULSE_ARGS is a list of flags
        pulse -C "${PULSE_ROOT}" ci ${PULSE_ARGS}
