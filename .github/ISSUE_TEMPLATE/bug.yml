name: Bug
description: A crash, a wrong exit code, broken output or anything else that is not a rule finding.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Pulse version
      description: Output of `pulse --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and install method
      placeholder: macOS 15 arm64, shell installer
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command you ran, and the files or `pulse.toml` it needs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
