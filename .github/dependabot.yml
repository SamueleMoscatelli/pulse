version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"                 # the workspace root: one Cargo.lock for all crates
    schedule: { interval: weekly }
    groups:
      cargo:                       # one PR a week, not one per crate
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"                 # .github/workflows/* and the root action.yml
    schedule: { interval: weekly }
    exclude-paths:
      - .github/workflows/release.yml   # generated by `dist generate`; hand edits break `dist plan`
    groups:
      actions:
        patterns: ["*"]
