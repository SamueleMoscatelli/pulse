name: False positive or wrong finding
description: Pulse reported something that is fine, or reported it at the wrong place or severity.
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: AI-COG-002
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pulse version
      description: Output of `pulse --version`.
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: Asset path
      description: The file's path relative to the repository root (it decides the asset kind).
      placeholder: .github/instructions/api.instructions.md
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Asset snippet
      description: The smallest part of the file that reproduces the finding. Remove anything private.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: Finding
      description: The finding as Pulse printed it.
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is wrong
    validations:
      required: true
